        // App Component Utama
        function App() {
            // Cloud Synchronization & Auth States
            const [isCloudConnected, setIsCloudConnected] = useState(false);
            const [cloudUser, setCloudUser] = useState(null);
            const [cloudDB, setCloudDB] = useState(null);

            // Persistent State Management dengan Penanganan Aman
            const [pegawaiList, setPegawaiList] = useState(() => {
                try {
                    const saved = localStorage.getItem('kemenhaj_pegawai_db');
                    return saved ? JSON.parse(saved) : INITIAL_PEGAWAI;
                } catch (e) {
                    return INITIAL_PEGAWAI;
                }
            });

            const [arsipSurat, setArsipSurat] = useState(() => {
                try {
                    const saved = localStorage.getItem('kemenhaj_arsip_surat');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            // Initialize Cloud Connection & Real-time Listeners
            useEffect(() => {
                const initCloudConnection = async () => {
                    try {
                        if (!window.CloudSDK) return;
                        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.CloudSDK;

                        let config = null;
                        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                            config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                        }

                        if (!config) {
                            console.log("Menjalankan dalam mode penyimpanan lokal.");
                            return;
                        }

                        const app = initializeApp(config);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        setCloudDB(db);

                        let userObj = null;
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            const res = await signInWithCustomToken(auth, __initial_auth_token);
                            userObj = res.user;
                        } else {
                            const res = await signInAnonymously(auth);
                            userObj = res.user;
                        }

                        setCloudUser(userObj);
                        setIsCloudConnected(true);
                    } catch (err) {
                        console.warn("Koneksi cloud tidak tersedia, menggunakan penyimpanan lokal:", err);
                    }
                };

                if (window.CloudSDK) {
                    initCloudConnection();
                } else {
                    window.addEventListener('cloud-sdk-ready', initCloudConnection);
                    return () => window.removeEventListener('cloud-sdk-ready', initCloudConnection);
                }
            }, []);

            // Real-time Cloud Data Synchronization Listeners
            useEffect(() => {
                if (!isCloudConnected || !cloudDB || !cloudUser) return;
                const { collection, onSnapshot, doc, setDoc } = window.CloudSDK;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'kemenhaj-makassar-app';

                // 1. Sync Collection Pegawai
                const pegawaiCol = collection(cloudDB, 'artifacts', appId, 'public', 'data', 'pegawai');
                const unsubPegawai = onSnapshot(
                    pegawaiCol,
                    async (snapshot) => {
                        if (snapshot.empty) {
                            for (const p of INITIAL_PEGAWAI) {
                                await setDoc(doc(cloudDB, 'artifacts', appId, 'public', 'data', 'pegawai', p.id.toString()), p);
                            }
                        } else {
                            const list = [];
                            snapshot.forEach(d => {
                                const data = d.data();
                                list.push({ ...data, id: isNaN(d.id) ? d.id : parseInt(d.id) });
                            });
                            setPegawaiList(list);
                        }
                    },
                    (error) => console.warn("Sync error pegawai:", error)
                );

                // 2. Sync Collection Arsip Surat
                const arsipCol = collection(cloudDB, 'artifacts', appId, 'public', 'data', 'arsip');
                const unsubArsip = onSnapshot(
                    arsipCol,
                    (snapshot) => {
                        const list = [];
                        snapshot.forEach(d => {
                            const data = d.data();
                            list.push({ ...data, id: isNaN(d.id) ? d.id : parseInt(d.id) });
                        });
                        list.sort((a, b) => b.id - a.id);
                        setArsipSurat(list);
                    },
                    (error) => console.warn("Sync error arsip:", error)
                );

                return () => {
                    unsubPegawai();
                    unsubArsip();
                };
            }, [isCloudConnected, cloudDB, cloudUser]);

            // State Modal Konfirmasi Hapus & Toast Notification Custom
            const [deleteConfirm, setDeleteConfirm] = useState({ show: false, type: null, id: null, title: '' });
            const [notification, setNotification] = useState(null);

            // State tracking dokumen yang sedang di-edit dari Arsip
            const [editingArsipId, setEditingArsipId] = useState(null);

            const showToast = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3500);
            };

            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedDocType, setSelectedDocType] = useState('cuti');
            const [previewDocument, setPreviewDocument] = useState(null);

            // Filter & Search Pegawai
            const [searchPegawai, setSearchPegawai] = useState('');
            const [filterJenis, setFilterJenis] = useState('ALL');

            // Modal Controls
            const [showPegawaiModal, setShowPegawaiModal] = useState(false);
            const [editPegawaiData, setEditPegawaiData] = useState(null);

            // Save database changes local fallback
            useEffect(() => {
                try {
                    localStorage.setItem('kemenhaj_pegawai_db', JSON.stringify(pegawaiList));
                } catch (e) {}
            }, [pegawaiList]);

            useEffect(() => {
                try {
                    localStorage.setItem('kemenhaj_arsip_surat', JSON.stringify(arsipSurat));
                } catch (e) {}
            }, [arsipSurat]);

            // Form States - SURAT CUTI
            const [cutiForm, setCutiForm] = useState({
                pegawaiId: "1",
                formatCuti: "SURAT_IZIN",
                jenisCuti: "Cuti Tahunan",
                alasanCuti: "Menjalankan kebiasaan tahunan / keperluan keluarga",
                lamaHari: "3",
                tglMulai: new Date().toISOString().split('T')[0],
                tglSelesai: new Date(Date.now() + 3*24*60*60*1000).toISOString().split('T')[0],
                tahunCuti: "2026",
                alamatCuti: "Jl. Sultan Alauddin No. 45, Kota Makassar",
                telpCuti: "0812-4455-6677",
                nomorSurat: "S-014/Kk.28.01/KW.28/2026",
                atasanId: "3",
                pejabatId: "1",
                catatanN2: "12",
                catatanN1: "12",
                catatanN: "12"
            });

            // Form States - SURAT TUGAS
            const [tugasForm, setTugasForm] = useState({
                tipeTugas: "PERORANGAN",
                nomorST: "ST-1264/Kk.28.01/2026",
                menimbang: "Bahwa untuk kelancaran pelaksanaan bimbingan manasik dan pelayanan jamaah haji/umrah di Kota Makassar, dipandang perlu menerbitkan Surat Tugas ini.",
                dasar: "1. UU No. 8 Tahun 2019 tentang Penyelenggaraan Ibadah Haji dan Umrah.\n2. DIPA Kantor Kementerian Haji dan Umrah Kota Makassar TA 2026.",
                maksud: "Melaksanakan Monitoring dan Konsolidasi Bimbingan Manasik di KBIHU Hati Nur Haramain di Masjid Nurul Huda Gusung dan KBIHU AL Ikhlas Mesra di Masjid Raya Jl. Bulu Saraung Kota Makassar",
                tempatTujuan: "KBIHU Kota Makassar",
                tglBerangkat: "2026-10-30",
                tglKembali: "2026-10-30",
                penandatanganId: "1",
                pegawaiTerpilih: ["1"],
                peranTim: { "1": "Ketua Tim" }
            });

            // Form States - SPD
            const [spdForm, setSpdForm] = useState({

                        {/* TOAST NOTIFICATION */}
                        {notification && (
                            <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2 border ${
                                notification.type === 'error' ? 'bg-red-900 text-white border-red-700' : 'bg-slate-900 text-white border-slate-700'
                            }`}>
                                <i className={`fa-solid ${notification.type === 'error' ? 'fa-circle-xmark text-red-400' : 'fa-circle-check text-emerald-400'}`}></i>
                                {notification.msg}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
