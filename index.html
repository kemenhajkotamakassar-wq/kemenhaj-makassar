            const compressImage = (file, maxWidth = 300, maxHeight = 300, quality = 0.85) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > maxWidth) {
                                    height = Math.round((height * maxWidth) / width);
                                    width = maxWidth;
                                }
                            } else {
                                if (height > maxHeight) {
                                    width = Math.round((width * maxHeight) / height);
                                    height = maxHeight;
                                }
                            }

                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            let compressedDataUrl = canvas.toDataURL('image/png');
                            if (compressedDataUrl.length > 500000) {
                                compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                            }
                            resolve(compressedDataUrl);
                        };
                        img.onerror = (err) => reject(err);
                    };
                    reader.onerror = (err) => reject(err);
                });
            };

            const handleLogoUpload = async (e) => {

            useEffect(() => {

                        if (!window.CloudSDK) return;

                        let config = null;
                        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                            config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                        }

                        if (!config) return;

                        const app = initializeApp(config);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        setCloudDB(db);

                        let userObj = null;
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            const res = await signInWithCustomToken(auth, __initial_auth_token);
                            userObj = res.user;
                        } else {
                            const res = await signInAnonymously(auth);
                            userObj = res.user;
                        }

                        setCloudUser(userObj);
                        setIsCloudConnected(true);
                    } catch (err) {
                        console.warn("Koneksi cloud tidak tersedia, menggunakan mode lokal:", err);
                    }
                };

                if (window.CloudSDK) {
                    initCloudConnection();
                } else {
                    window.addEventListener('cloud-sdk-ready', initCloudConnection);
                    return () => window.removeEventListener('cloud-sdk-ready', initCloudConnection);
                }
            }, []);

                if (!isCloudConnected || !cloudDB || !cloudUser) return;
                const { collection, onSnapshot, doc, setDoc } = window.CloudSDK;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'kemenhaj-makassar-app';

                                    <div className="flex justify-end gap-2 pt-3 border-t">
                                        <button type="button" onClick={() => setShowPegawaiModal(false)} className="px-4 py-2 bg-slate-200 text-slate-800 font-bold text-xs rounded-xl">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs rounded-xl shadow">Simpan Data Pegawai</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: KONFIRMASI HAPUS */}
                    {deleteConfirm.show && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4 border border-slate-200 animate-in fade-in zoom-in duration-200">
                                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                </div>
                                <div>
                                    <h3 className="font-bold text-base text-slate-900">Konfirmasi Hapus</h3>
                                    <p className="text-xs text-slate-500 mt-1">Apakah Anda yakin ingin menghapus <strong>{deleteConfirm.title}</strong>?</p>
                                </div>
                                <div className="flex justify-center gap-2 pt-2">
                                    <button onClick={() => setDeleteConfirm({ show: false, type: null, id: null, title: '' })} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs rounded-xl">Batal</button>
                                    <button onClick={handleConfirmDelete} className="px-5 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl shadow">Ya, Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer System Info */}
                    <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 no-print">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                            <p>© 2026 SIMPEG Kantor Kementerian Haji dan Umrah Kota Makassar. Hak Cipta Dilindungi.</p>
                            <div className="flex items-center gap-4">
                                <span className="text-[10px] font-mono bg-slate-100 px-2 py-0.5 rounded border border-slate-300">v2.4.0 (BKN 24/2017 &amp; BKN 07/2022)</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
